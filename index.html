<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f2f2f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Speleu?</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --ink2:#8e8e93;
    --ja:#34c759; --nee:#ff3b30; --misschien:#ff9500; --deels:#007aff;
    --accent:#007aff; --radius:18px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
    background:rgba(242,242,247,.85);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid rgba(0,0,0,.08);
  }
  header h1{font-size:22px;font-weight:700;margin:0;flex:1;letter-spacing:-.3px}
  .iconbtn{
    width:40px;height:40px;border:none;border-radius:12px;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
  }
  .iconbtn:active{background:rgba(0,0,0,.08)}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#5ac8fa,#007aff);
    color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;
  }
  main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
  .syncbar{
    display:none;align-items:center;gap:8px;font-size:13px;color:var(--ink2);
    background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:12px;
  }
  .syncbar.show{display:flex}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--nee);flex:none}
  .dot.ok{background:var(--ja)}
  .day{
    background:var(--card);border-radius:var(--radius);margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden;
  }
  .dayhead{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;cursor:pointer;flex-wrap:wrap}
  .daynotes{padding:2px 16px 10px;font-size:12.5px;color:var(--ink2)}
  .daynotes b{color:var(--ink)}
  .notedel{margin-left:8px;cursor:pointer;color:var(--ink2);font-size:12px;padding:0 4px}
  .notedel:hover{color:#ff3b30}
  .dateblock{
    flex:none;width:52px;height:56px;border-radius:14px;text-align:center;
    background:linear-gradient(160deg,#eaf4ff,#dceaff);display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .dateblock .dow{font-size:10px;font-weight:700;color:var(--deels);text-transform:uppercase;letter-spacing:.5px}
  .dateblock .dn{font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
  .dateblock .mo{font-size:10px;font-weight:600;color:var(--ink2);text-transform:uppercase}
  .daytitlewrap{flex:1;min-width:0}
  .daytitle{font-size:17px;font-weight:650;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
  .daytitle .pen{opacity:.35;cursor:pointer}
  .daysub{font-size:12px;color:var(--ink2);margin-top:2px}
  .badges{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 16px;justify-content:flex-end}
  .chip{
    display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid rgba(0,0,0,.14);
    background:#fff;color:var(--ink);user-select:none;transition:transform .08s;
    position:relative;
  }
  .chip:active{transform:scale(.94)}
  .chip .st{width:10px;height:10px;border-radius:50%;background:#d1d1d6;flex:none}
  .chip[data-st="ja"]{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.4);color:#1d7a35}
  .chip[data-st="ja"] .st{background:var(--ja)}
  .chip[data-st="deels"]{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.35);color:#005ecb}
  .chip[data-st="deels"] .st{background:var(--deels)}
  .chip[data-st="misschien"]{background:rgba(255,149,0,.14);border-color:rgba(255,149,0,.4);color:#a35c00}
  .chip[data-st="misschien"] .st{background:var(--misschien)}
  .chip[data-st="nee"]{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.35);color:#c22b22}
  .chip[data-st="nee"] .st{background:var(--nee)}
  .chip.guest{border-style:solid}
  .chip .x{opacity:.5;font-size:12px}
  .chip .chipnote{position:absolute;top:-7px;right:-5px;font-size:12px;cursor:pointer;
    background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:50%;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .chip .chipnote.empty{opacity:.35}
  .chip .chipnote:hover{opacity:1}
  .addguest{
    border:none;background:none;color:var(--deels);font-size:13px;font-weight:600;
    padding:6px 8px;cursor:pointer;
  }
  .day.target{
    background:linear-gradient(160deg,#fff 55%,#eef6ff);border:2px solid rgba(0,122,255,.45);
    box-shadow:0 4px 16px rgba(0,122,255,.18);
  }
  .targetlabel{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;
    background:var(--deels);border-radius:999px;padding:4px 10px;letter-spacing:.4px;text-transform:uppercase;
  }
  .countdown{font-size:12px;font-weight:700;color:var(--deels);margin-left:auto;text-align:right;line-height:1.35}
  .dayballoon{font-size:17px;cursor:pointer;opacity:.45;padding:2px 0 2px 8px;flex:none}
  .dayballoon:hover{opacity:1}
  .countdown b{display:block;font-size:16px}
  .row-btns{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px}
  .mini{border:none;background:none;color:var(--ink2);font-size:12px;cursor:pointer;padding:6px}
  .mini:active{opacity:.5}
  .sectionlabel{font-size:13px;font-weight:700;color:var(--ink2);margin:22px 4px 10px;text-transform:uppercase;letter-spacing:.5px}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;
    align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
    max-height:82vh;overflow:auto;
  }
  .sheet h3{margin:0 0 14px;font-size:19px;letter-spacing:-.3px}
  .menuitem{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:none;
    padding:14px 4px;font-size:16px;color:var(--ink);border-bottom:.5px solid rgba(0,0,0,.07);cursor:pointer;
    text-decoration:none;
  }
  .menuitem:last-child{border-bottom:none}
  .menuitem span.g{flex:1}
  .menuitem .sub{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
  .seg{display:flex;gap:8px;margin:14px 0}
  .seg button{
    flex:1;border:none;border-radius:12px;padding:12px 0;font-size:14px;font-weight:700;cursor:pointer;
    background:#f2f2f7;color:var(--ink2);font-family:inherit;
  }
  .seg button.sel{background:#8e8e93;color:#fff}
  .seg button.sel[data-v="ja"]{background:var(--ja)}
  .seg button.sel[data-v="nee"]{background:var(--nee)}
  .seg button.sel[data-v="misschien"]{background:var(--misschien)}
  .seg button.sel[data-v="deels"]{background:var(--deels)}
  input[type=text],input[type=date]{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(0,0,0,.12);
    font-size:16px;background:#fff;color:var(--ink);margin-bottom:12px;font-family:inherit;
  }
  .checkrow{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0 14px}
  .checkrow input{width:20px;height:20px;accent-color:var(--accent)}
  .cta{
    width:100%;border:none;border-radius:14px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;padding:14px;cursor:pointer;margin-top:6px;font-family:inherit;
  }
  .cta:active{opacity:.8}
  .logline{font-size:13px;color:var(--ink);padding:9px 0;border-bottom:.5px solid rgba(0,0,0,.07)}
  .logline b{font-weight:650}
  .logline .t{color:var(--ink2);font-size:11px}
  .loglist{max-height:44vh;overflow:auto}
  .empty{color:var(--ink2);font-size:14px;text-align:center;padding:32px 0}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c1c1e;color:#fff;
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1}
  .fab{
    position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:30;
    width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,122,255,.4);display:flex;align-items:center;justify-content:center;
  }
  a{color:var(--deels)}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="btnMenu" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <h1>Speleu?</h1>
  <button class="avatar" id="btnMe" style="display:none"></button>
</header>

<main>
  <div class="syncbar" id="syncbar"><span class="dot" id="syncdot"></span><span id="synctext"></span></div>
  <div id="upcoming"></div>
  <div id="past"></div>
</main>

<button class="fab" id="fabAdd" aria-label="Datum toevoegen">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="ovMenu"><div class="sheet" id="shMenu"></div></div>
<div class="overlay" id="ovSheet"><div class="sheet" id="shSheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG =================
 * Zonder login: de app praat met een kleine Google Apps Script-webapp die
 * namens jou leest en schrijft in banddays.json (in de gedeelde Drive-map).
 * Iedereen met de link mag lezen én schrijven; de app onthoudt per apparaat
 * wie je bent (localStorage) en logt elke wijziging.
 * Laat SCRIPT_URL leeg → demomodus met localStorage (preview werkt meteen).
 */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycby80LtzoOzt6IOpU1SXmgiCTGfbndRtL4gRmF80bB9jn-0AwY5YCwnZfCec2xvus_F_eA/exec",
  MONOLISA_URL: "https://resubyrah.github.io/moly/monolisa/",
  MEMBERS: ["Frans", "Peter", "Patrick", "Wim", "Harrie"],  // vaste bandleden (aliases, zelf aanpasbaar)
  SATURDAYS: 10,                       // aantal komende zaterdagen
  HISTORY_MONTHS: 6,                   // dagen ouder dan dit worden uit de data gesnoeid
  LOG_MAX: 300                        // max regels in de wijzigingenlog
};
/* ========================================= */

const STATUS = ["ja","nee","misschien"];   // tik op chip = doorlopen; "deels" kan in een opmerking
const VERSION = "3.12";
const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DOWS = ["zo","ma","di","wo","do","vr","za"];

let DATA = {members:[...CONFIG.MEMBERS], recurring_guests:[], days:{}, log:[], target:"2027-01-31"};
let me = localStorage.getItem("bd_me") || "";
// Anoniem apparaat-ID: onderscheidt apparaten in de log als iemand geen naam heeft gekozen
let DEVID = localStorage.getItem("bd_devid");
if(!DEVID){ DEVID = Math.random().toString(36).slice(2,8); localStorage.setItem("bd_devid", DEVID); }
let dirty = false;          // lokale wijzigingen nog niet naar de cloud
let showHist = false;       // historie tonen? standaard verborgen, via ☰-menu aan te zetten
let serverRev = 0;           // revisie (Drive-timestamp) van de data zoals we die laast zagen
let pendingOps = [];         // eigen wijzigingen sinds laatste geslaagde sync (voor merge)

function queueOp(op){ pendingOps.push(op); }
function applyOp(o){
  if(o.t==="st"){ const d=day(o.d); if(o.g){ const g=d.guests.find(g=>g.name===o.n); if(g) g.st=o.s; } else { if(o.s) d.st[o.n]=o.s; else delete d.st[o.n]; } }
  else if(o.t==="title"){ day(o.d).title = o.v; }
  else if(o.t==="note"){ const d=day(o.d); if(!d.notes) d.notes={}; if(o.v) d.notes[o.n]=o.v; else delete d.notes[o.n]; }
  else if(o.t==="addg"){ const d=day(o.d); if(!d.guests.some(g=>g.name===o.n)) d.guests.push({name:o.n, st:o.s||""}); }
  else if(o.t==="rmg"){ const d=day(o.d); d.guests = d.guests.filter(g=>g.name!==o.n); }
  else if(o.t==="delday"){ delete DATA.days[o.d]; }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function iso(d){ return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T12:00:00"); return `${DOWS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function nextSaturdays(n){
  const out=[]; const d=new Date(); d.setHours(12,0,0,0);
  while(d.getDay()!==6) d.setDate(d.getDate()+1);
  for(let i=0;i<n;i++){ out.push(iso(d)); d.setDate(d.getDate()+7); }
  return out;
}
function today(){ const d=new Date(); d.setHours(12,0,0,0); return iso(d); }

/* ---------- data ---------- */
function day(dateStr){ if(!DATA.days[dateStr]) DATA.days[dateStr]={title:"",st:{},guests:[]}; return DATA.days[dateStr]; }

function setStatus(dateStr, name, st, isGuest){
  const d = day(dateStr);
  const old = (isGuest? (d.guests.find(g=>g.name===name)||{}).st : d.st[name]) || "";
  if(isGuest){ const g=d.guests.find(g=>g.name===name); if(g) g.st=st; }
  else { if(st) d.st[name]=st; else delete d.st[name]; }
  queueOp({t:"st", d:dateStr, n:name, s:st, g:isGuest?1:0});
  logChange(name, dateStr, old, st);
  save();
}
let pendingLog = [];       // nog niet verzonden logregels
function logChange(target, dateStr, from, to){
  const entry = {
    t: new Date().toISOString().replace("T"," ").slice(0,16),
    who: me || ("apparaat-" + DEVID), target, date: dateStr, from, to
  };
  pendingLog.unshift(entry);
  pendingLog = pendingLog.slice(0, CONFIG.LOG_MAX);
}

function addGuest(dateStr, name){
  const d = day(dateStr);
  if(!name || d.guests.some(g=>g.name.toLowerCase()===name.toLowerCase())) return;
  d.guests.push({name, st:""});
  queueOp({t:"addg", d:dateStr, n:name});
  logChange(name, dateStr, "", "toegevoegd");
  save();
}
function removeGuest(dateStr, name){
  const d = day(dateStr);
  d.guests = d.guests.filter(g=>g.name!==name);
  queueOp({t:"rmg", d:dateStr, n:name});
  logChange(name, dateStr, "", "verwijderd");
  save();
}

/* ---------- opslag: localStorage + Apps Script (zonder login) ---------- */
function save(){
  localStorage.setItem("bd_data", JSON.stringify(DATA));
  dirty = true; prune(); render();
  scheduleSync();          // wacht tot de gebruiker 5 s niets doet, sync dan alles in één keer
}
function prune(){
  const cut = new Date(); cut.setHours(12,0,0,0);
  cut.setMonth(cut.getMonth() - CONFIG.HISTORY_MONTHS);
  const cutStr = iso(cut);
  Object.keys(DATA.days).forEach(dk=>{ if(dk < cutStr) delete DATA.days[dk]; });
  // Extra spelers die op de meest recente afgelopen dag niet gereageerd
  // hebben, verdwijnen weer uit de standaardlijst.
  const t = today();
  const past = Object.keys(DATA.days).filter(k=>k<t).sort();
  const last = past[past.length-1];
  if(!last) return;
  DATA.recurring_guests = (DATA.recurring_guests||[]).filter(g=>{
    if(g.since > last) return true;              // pas later aangemeld → nog geen oordeel
    const wasThere = !!(DATA.days[last].st||{})[g.name];
    if(!wasThere) logChange(g.name, last, "extra speler", "automatisch van lijst: niet gereageerd");
    return wasThere;
  });
}

function renameMember(oldN, newN){
  if(!newN){ toast("Vul een naam in"); return false; }
  // hernoemen naar een bestaande naam is verboden — lookup overal in de data:
  // leden, vaste gasten, gast-chips op dagen, én al getikte namen
  const inUse = DATA.members.includes(newN)
    || (DATA.recurring_guests||[]).some(g=>g.name===newN)
    || Object.values(DATA.days).some(d=>d.st && (newN in d.st))
    || Object.values(DATA.days).some(d=>(d.guests||[]).some(g=>g.name===newN));
  if(inUse && newN !== oldN){ toast("Die naam is al in gebruik — kies een andere"); return false; }
  const i = DATA.members.indexOf(oldN);
  if(i>=0) DATA.members[i] = newN;
  Object.values(DATA.days).forEach(d=>{
    if(d.st && oldN in d.st){ d.st[newN] = d.st[oldN]; delete d.st[oldN]; }
  });
  logChange(newN, "", oldN, "alias gewijzigd");
  return true;
}

async function load(){
  const local = localStorage.getItem("bd_data");
  if(local){ try{ DATA = JSON.parse(local); }catch(e){} }
  if(CONFIG.SCRIPT_URL){
    try{
      const r = await fetch(CONFIG.SCRIPT_URL + "?t=" + Date.now() + authQS());
      if(r.ok){
        const env = await r.json();
        if(env && env.auth === false){
          if(ACCOUNT || PWH){               // alleen bij een échte inlogpoging (niet bij uitgelogde polls)
            setSync(false, "Login geweigerd: " + (env.err || "onbekende reden") + syncTimeTxt());
            wantPw = true;                  // server vroeg om een wachtwoord → volgende modal wél met wachtwoordveld
          }
          needLoginModal();
        }   // scherm blijft gewoon tekenen met lokale data
        else if(env && env.data && env.data.days){
          DATA = env.data; serverRev = env.rev||0; ADMIN = env.admin === true; wantPw = false; localStorage.setItem("bd_data", JSON.stringify(DATA));
          if(env.tok && !PWH){                  // grace-login geaccepteerd: sessie-code van de server bewaren
            PWH = env.tok; localStorage.setItem("bd_pwh", PWH);
          }
          if(!loginLogged && ACCOUNT){                 // wie, wanneer, vanaf welk apparaat/regio
            loginLogged = true;
            logChange("login", "", "app-open", deviceInfo());
            save();
          }
        }
      }
      if(!loginAsked) setSync(true, (dirty? "Lokale wijzigingen nog niet opgeslagen in de cloud" : "Gesynchroniseerd met de gedeelde map") + syncTimeTxt());
    }catch(e){ setSync(false, "Cloud niet bereikbaar – lokale gegevens"); }
  } else {
    setSync(false, "Demomodus: opgeslagen op dit apparaat");
  }
  render();
}

function setSync(ok, txt){
  const b=$("#syncbar"); b.classList.add("show");
  $("#synctext").textContent = txt + (!ok && !CONFIG.SCRIPT_URL? " · vul SCRIPT_URL in CONFIG voor cloud" : "");
  $("#syncdot").className = "dot" + (ok? " ok":"");
}

let lastSyncT = null;      // tijdstip laatste geslaagde cloud-sync

/* ---------- Toegang: naam + band-wachtwoord (per apparaat onthouden) ---------- */
let ACCOUNT = localStorage.getItem("bd_user") || "";   // de naam waarmee je bent ingelogd
let PWH = localStorage.getItem("bd_pwh") || "";         // SHA-256 van het band-wachtwoord
let ADMIN = false;                                     // bepaalt de backend na elke sync (admin logt in met de beheerderscode)
let loginAsked = false;

async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function authQS(){ return (ACCOUNT? "&u=" + encodeURIComponent(ACCOUNT) : "") + (PWH? "&k=" + PWH : ""); }
let wantPw = false;      // wachtwoordveld pas tonen nadat de server om een wachtwoord vroeg
function needLoginModal(){
  if(loginAsked) return;
  loginAsked = true;
  setSync(false, "Eerst inloggen");
  openSheet(`<h3>🔐 Inloggen</h3>
    <p style="font-size:14px;color:var(--ink2)">${wantPw? "Vul je naam en het wachtwoord in." : "Vul je naam in."}</p>
    <input type="text" id="liName" placeholder="Je naam" value="${esc(ACCOUNT||"")}" autocomplete="off" style="margin-bottom:8px">
    ${wantPw? `<input type="password" id="liPw" placeholder="Wachtwoord" autocomplete="off">` : ""}
    <button class="cta" id="liOk">Aanmelden</button>`);
  $("#liName").focus();
  $("#liOk").onclick = async ()=>{
    const nm = $("#liName").value.trim();
    const pwEl = $("#liPw");               // bestaat alleen als de server eerder om een wachtwoord vroeg
    const pw = pwEl? pwEl.value : "";
    if(!nm){ toast("Vul je naam in"); return; }
    if(pwEl && !pw){ toast("Vul ook het wachtwoord in"); return; }
    ACCOUNT = nm; localStorage.setItem("bd_user", nm);
    me = nm; localStorage.setItem("bd_me", nm);
    PWH = pw? await sha256(pw) : "";        // leeg = grace-poging (server beslist)
    localStorage.setItem("bd_pwh", PWH);
    loginAsked = false;
    closeSheet();
    setSync(true, "Ingelogd als " + nm + " – synchroniseren…" + syncTimeTxt());
    load();
  };
}
function feat(key, dflt){                      // feature-toggle uitlezen (staat in de gedeelde data)
  if(!DATA.features) return dflt;
  const v = DATA.features[key];
  return v === undefined? dflt : v;
}

function deviceInfo(){
  let tz = "—";
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "—"; }catch(e){}
  const ua = navigator.userAgent || "";
  const dev = /iPhone/.test(ua)? "iPhone" : /iPad/.test(ua)? "iPad" : /Android/.test(ua)? "Android"
            : /Macintosh/.test(ua)? "Mac" : /Windows/.test(ua)? "Windows" : "onbekend";

}

function syncTimeTxt(){
  return lastSyncT? " · laatste sync " + lastSyncT.toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "";
}
let syncTimer = null;
function scheduleSync(){   // debounce: pas syncen als de gebruiker 5 s stil is
  setSync(true, "Wijzigingen bewaard – syncen als je klaar bent" + syncTimeTxt());
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ if(dirty) pushCloud(); }, 5000);
}

async function pushCloud(){
  if(!CONFIG.SCRIPT_URL) return;
  prune();
  try{
    const r = await fetch(CONFIG.SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},   // text/plain → geen CORS-preflight
      body: JSON.stringify({rev: serverRev, data: DATA, log: pendingLog, u: ACCOUNT, k: PWH})
    });
    const res = await r.json();
    if(res && res.auth === false){ setSync(false, "Login geweigerd: " + (res.err || "onbekende reden")); wantPw = true; needLoginModal(); return; }
    if(res && res.ok){
      dirty = false; pendingOps = []; serverRev = res.rev||0; pendingLog = [];
      lastSyncT = new Date();
      setSync(true, "Gesynchroniseerd met de gedeelde map" + syncTimeTxt());
    }
    else if(res && res.conflict){
      // Iemand anders heeft ondertussen opgeslagen: verse data ophalen,
      // eigen wijzigingen eroverheen leggen en één keer opnieuw sturen.
      DATA = res.data || DATA; serverRev = res.rev||0;
      try{ pendingOps.forEach(applyOp); }catch(e){}
      logChange("—", "", "conflict", "andere wijzigingen samengevoegd");
      const r2 = await fetch(CONFIG.SCRIPT_URL, {
        method:"POST", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({rev: serverRev, data: DATA, log: pendingLog, u: ACCOUNT, k: PWH})
      });
      const res2 = await r2.json();
      if(res2 && res2.auth === false){ needLoginModal(); return; }
      if(res2 && res2.ok){ dirty = false; pendingOps = []; serverRev = res2.rev||0; pendingLog = [];
        lastSyncT = new Date();
        setSync(true, "Gesynchroniseerd met de gedeelde map" + syncTimeTxt()); render(); return; }
      throw new Error();
    }
    else throw new Error();
  }catch(e){ syncFailedModal(); }
}

// Verse data van anderen ophalen (alleen als we zelf niets open hebben staan)
async function pull(){
  if(!CONFIG.SCRIPT_URL || dirty) return;
  try{
    const r = await fetch(CONFIG.SCRIPT_URL + "?t=" + Date.now() + authQS());
    if(!r.ok) return;
    const env = await r.json();
    if(env && env.auth === false){ return; }   // stil: wachten op login
    if(env && env.data && env.data.days && env.rev !== serverRev){
      DATA = env.data; serverRev = env.rev||0;
      localStorage.setItem("bd_data", JSON.stringify(DATA));
      render();
    }
  }catch(e){}
}

function memberChip(dateStr, name, st, guest){
  const x = guest? `<span class="x" data-act="rmguest" data-date="${dateStr}" data-name="${esc(name)}">✕</span>` : "";
  return `<span class="chip${guest?" guest":""}" data-st="${st}" data-act="cycle" data-date="${dateStr}" data-name="${esc(name)}" data-guest="${guest?1:0}">
    <span class="st"></span>${esc(name)}${x}</span>`;
}
function chipRow(dateStr, d){
  let html = "";
  DATA.members.forEach(m=>{ html += memberChip(dateStr, m, d.st[m]||"", false); });
  // Terugkerende gasten: alleen zichtbaar voor iedereen als ze zijn ingevuld;
  // de gast zelf ziet zijn eigen chip op alle dagen (om in te tikken)
  (DATA.recurring_guests||[]).forEach(g=>{ if(d.st[g.name] || g.name===me) html += memberChip(dateStr, g.name, d.st[g.name]||"", false); });
  d.guests.forEach(g=>{ html += memberChip(dateStr, g.name, g.st||"", true); });
  return `<div class="chips">${html}</div>`;
}
function counts(d){
  const c = {ja:0,deels:0,misschien:0,nee:0};
  Object.values(d.st||{}).forEach(v=>{ if(c[v]!==undefined) c[v]++; });
  (d.guests||[]).forEach(g=>{ if(c[g.st]!==undefined) c[g.st]++; });
  return c;
}
function dayCard(dateStr, past){
  const d = day(dateStr);
  const dt = new Date(dateStr+"T12:00:00");
  const c = counts(d);
  const isTarget = DATA.target && dateStr===DATA.target;
  const isSat = dt.getDay()===6;
  const title = d.title? esc(d.title) : (isTarget? "Optreden" : (isSat? "Spelen" : "Extra dag"));
  let cd = "";
  if(isTarget){
    const diff = Math.round((new Date(dateStr+"T12:00:00") - new Date(today()+"T12:00:00"))/86400000);
    cd = `<div class="countdown">nog<b>${diff>0? diff : 0}</b>${diff===1? "dag" : "dagen"}</div>`;
  }
  return `<div class="day${isTarget?" target":""}">
    <div class="dayhead" data-act="title" data-date="${dateStr}">
      <div class="dateblock"><div class="dow">${DOWS[dt.getDay()]}</div><div class="dn">${dt.getDate()}</div><div class="mo">${MONTHS[dt.getMonth()]}</div></div>
      <div class="daytitlewrap">
        <div class="daytitle">${isTarget? '<span class="targetlabel">🎯 Optreden</span>' : ""} ${title}<span class="pen" data-act="title" data-date="${dateStr}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg></span></div>
        <div class="daysub">${fmtDate(dateStr)}${isSat?" · zaterdag":""}</div>
      </div>${cd}
      <span class="dayballoon" data-act="daynote" data-date="${dateStr}" title="Opmerking voor deze dag">💬</span>
    </div>
    <div class="badges">
      <span class="b"><i style="background:var(--ja)"></i>${c.ja} ja</span>
      <span class="b"><i style="background:var(--misschien)"></i>${c.misschien} misschien</span>
      <span class="b"><i style="background:var(--nee)"></i>${c.nee} nee</span>
    </div>
    ${chipRow(dateStr, d)}
    ${Object.entries(d.notes||{}).filter(([k,v])=>v).map(([k,v])=>`<div class="daynotes">💬 <b>${esc(k)}:</b> ${esc(v)}${k===me? `<span class="notedel" data-act="delnote" data-date="${dateStr}" data-name="${esc(k)}">✕</span>` : ""}</div>`).join("")}
  </div>`;
}
function render(){
  const av = $("#btnMe");
  av.style.display = me? "flex" : "none";
  av.textContent = (me||"").slice(0,2).toUpperCase();
  av.title = me || "";                 // hover: de volledige naam; klik doet niets (naam komt vast uit de login)

  const sats = nextSaturdays(CONFIG.SATURDAYS);
  // alle zaterdagen tot aan het target meenemen (bv. bij optreden verder weg)
  if(DATA.target){
    let d = new Date(); d.setHours(12,0,0,0);
    while(d.getDay()!==6) d.setDate(d.getDate()+1);
    while(iso(d) <= DATA.target){ if(!sats.includes(iso(d))) sats.push(iso(d)); d.setDate(d.getDate()+7); }
  }
  sats.forEach(s=>{ if(!DATA.days[s]) DATA.days[s]={title:"",st:{},guests:[]}; });
  if(DATA.target && !DATA.days[DATA.target]) DATA.days[DATA.target]={title:"",st:{},guests:[]};

  const t = today();
  const all = Object.keys(DATA.days).sort();
  const up = all.filter(dk=>dk>=t);
  const pastD = all.filter(dk=>dk<t);

  $("#upcoming").innerHTML = up.map(dk=>dayCard(dk,false)).join("");
  $("#past").innerHTML = (showHist && pastD.length)?
    `<div class="sectionlabel">🗓 Historie</div>` + pastD.slice().reverse().map(dk=>dayCard(dk,true)).join("") : "";
  balanceChips();
}

// Chips gelijkmatig in rijen vanaf rechts: past alles op één rij → één rij;
// anders rijen vullen die per rij max één verschil hebben (5 → 3+2, 8 → 4+4)
function balanceChips(){
  document.querySelectorAll(".chips").forEach(box=>{
    const chips = [...box.querySelectorAll(":scope > .chip")];
    if(chips.length < 4) return;
    const gap = 8, W = box.clientWidth - 32;   // inhoudsbreedte (padding 16+16)
    let k = 0, tot = 0;
    for(const c of chips){
      const w = c.offsetWidth + gap;
      if(tot + w <= W + 1){ tot += w; k++; } else break;
    }
    if(!k || k >= chips.length) return;        // past op één rij
    const rows = Math.ceil(chips.length / k);
    const per = Math.ceil(chips.length / rows);
    chips.forEach(c=>c.remove());
    for(let i=0; i<chips.length; i+=per){
      const row = document.createElement("div");
      row.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;width:100%";
      if(i) row.style.marginTop = "8px";
      chips.slice(i, i+per).forEach(c=>row.appendChild(c));
      box.appendChild(row);
    }
  });
}

document.body.addEventListener("click", e=>{

  if(!el) return;
  const act = el.dataset.act, dateStr = el.dataset.date, name = el.dataset.name;
  if(act==="cycle"){

      const idx = STATUS.indexOf(cur);
      setStatus(dateStr, name, idx < STATUS.length-1 ? STATUS[idx+1] : "", guest);
    };
    if(!me){ me = name; localStorage.setItem("bd_me", me); doCycle(); }
    else if(me===name){ doCycle(); }
    else{
      // op een andere naam getikt: ben je het zelf of wijzig je namens iemand?
      openSheet(`<h3>Wie is dit?</h3>
        <p style="font-size:14px;color:var(--ink2)">Je staat bekend als <b>${esc(me)}</b> en tikte op <b>${esc(name)}</b>.</p>

      $("#id1").onclick = ()=>{ me = name; localStorage.setItem("bd_me", me); closeSheet(); doCycle(); };
    }
  }
  else if(act==="rmguest"){ e.stopPropagation(); removeGuest(dateStr, name); }
  else if(act==="delnote"){
    const d = day(dateStr);
    if(d.notes) delete d.notes[name];
    logChange(name, dateStr, "", "opmerking gewist");
    queueOp({t:"note", d:dateStr, n:name, v:""});
    save();
  }
  else if(act==="daynote"){ if(!me) needLoginModal(); else openNoteSheet(dateStr, me); }
  else if(act==="addguest"){ openGuestSheet(dateStr); }
  else if(act==="title"){ openTitleSheet(dateStr); }
  else if(act==="log"){ openLogSheet(dateStr); }
  else if(act==="del"){
    if(confirm("Deze dag verwijderen uit Speleu??")){ delete DATA.days[dateStr]; queueOp({t:"delday", d:dateStr}); save(); }
  }
});

let logCache = [];
async function fetchLog(){
  if(CONFIG.SCRIPT_URL){

      if(r.ok){ const env = await r.json(); if(env && env.auth === false){ needLoginModal(); return pendingLog; }

        logCache = env.log.sort((a,b)=> String(b.t).localeCompare(String(a.t)));   // nieuwste eerst

  // offline: wat we lokaal nog niet verzonden hebben

}

  else if(m==="hist"){ showHist = true; render(); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); }
  else if(m==="fulllog") openFullLog();
  else if(m==="feats") openFeatsSheet();
  else if(m==="logout"){
    ACCOUNT = ""; PWH = ""; me = ""; ADMIN = false; loginAsked = false;
    localStorage.removeItem("bd_user"); localStorage.removeItem("bd_pwh"); localStorage.removeItem("bd_me");
    closeMenu();
    setSync(false, "Uitgelogd — lokale gegevens blijven staan");
    needLoginModal();
    render();
  }
});

function closeMenu(){ $("#ovMenu").classList.remove("show"); }

function openFeatsSheet(){
  if(!ADMIN){ toast("Alleen voor beheerders"); return; }
  const toggles = [
    { key: "extraDatum",  label: "📅 Extra datum toevoegen", sub: "Mogen alle bandleden extra dagen toevoegen, of alleen beheerders?" },
    { key: "graceLogin",  label: "🔓 Eerste keer zonder wachtwoord", sub: "Nieuw op een apparaat: eerste keer mag zonder wachtwoord. Uit = wachtwoord altijd verplicht (bestaande gratis-sessies vervallen dan)" }
  ];
  openSheet(`<h3>⚙️ Instellingen &amp; features</h3>
    <p style="font-size:12px;color:var(--ink2);margin-top:-8px">Wijzigingen gelden meteen voor de hele band (binnen ~10 s, zonder verversen)</p>
    ${toggles.map(t=>`
      <label class="checkrow" style="margin-top:10px"><input type="checkbox" data-fk="${t.key}" ${feat(t.key, true)? "checked":""}> <b>${t.label}</b>
      <div style="font-size:12px;color:var(--ink2);font-weight:400">${t.sub}</div></label>`).join("")}
    <div style="margin-top:18px;padding-top:12px;border-top:1px solid #e8e6df">
      <b style="font-size:14px">↺ Gratis-sessies</b>
      <div style="font-size:12px;color:var(--ink2);margin:4px 0 8px">Deze namen zijn ooit zonder wachtwoord binnengekomen. Wis een sessie om iemand op een nieuw apparaat opnieuw zonder wachtwoord te laten inloggen.</div>
      ${Object.keys((DATA.sessions||{})).length? Object.keys(DATA.sessions).map(n=>`
        <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0">
          <span style="font-size:14px">${esc(n)}</span>
          <button class="mini" data-ress="${esc(n)}" style="color:#c0392b">↺ sessie wissen</button>
        </div>`).join("") : `<div style="font-size:13px;color:var(--ink2)">Nog geen gratis-sessies uitgegeven.</div>`}
    </div>
    <button class="cta" id="fOk">Klaar</button>`);
  $("#shSheet").querySelectorAll("[data-fk]").forEach(cb=>{
    cb.onchange = ()=>{
      if(!DATA.features) DATA.features = {};
      DATA.features[cb.dataset.fk] = cb.checked;
      logChange(me || "—", "", cb.dataset.fk, cb.checked? "aan" : "uit");
      save();   // sync't meteen → andere apparaten zien het binnen 10 s
    };
  });
  $("#shSheet").querySelectorAll("[data-ress]").forEach(b=>{
    b.onclick = ()=>{
      const n = b.dataset.ress;
      if(DATA.sessions && DATA.sessions[n]){
        delete DATA.sessions[n];
        logChange(n, "", "gratis-sessie", "gewist — mag opnieuw zonder wachtwoord");
        save();
        openFeatsSheet();   // lijst verversen
      }
    };
  });
  $("#fOk").onclick = closeSheet;
}

function openDateSheet(){
  openSheet(`<h3>Extra datum toevoegen</h3>
    <input type="date" id="dDate">
    <input type="text" id="dTitle" placeholder="Titel (optioneel, bv. generale)">
    <button class="cta" id="dOk">Toevoegen</button>`);
  $("#dOk").onclick = ()=>{
    const v = $("#dDate").value;
    if(!v){ toast("Kies een datum"); return; }
    day(v).title = $("#dTitle").value.trim();
    logChange("—", v, "", "dag toegevoegd");
    save(); closeSheet();
    const el = document.querySelector(`[data-act="cycle"][data-date="${v}"]`);
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  };
}

function openTargetSheet(){
  openSheet(`<h3>🎯 Optreden</h3>
    <input type="date" id="tDate" value="${DATA.target||""}">
    <button class="cta" id="tOk">Instellen</button>
    <button class="cta" id="tClear" style="background:#8e8e93;margin-top:10px">Target verwijderen</button>`);
  $("#tOk").onclick = ()=>{
    const v = $("#tDate").value;
    if(!v){ toast("Kies een datum"); return; }
    DATA.target = v;
    if(!DATA.days[v]) DATA.days[v] = {title:"", st:{}, guests:[]};
    logChange("—", v, DATA.target, "doel/optreden ingesteld");
    save(); closeSheet();
    const el = document.querySelector(`[data-act="cycle"][data-date="${v}"]`);
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  };
  $("#tClear").onclick = ()=>{
    if(DATA.target) logChange("—", DATA.target, "doel/optreden", "verwijderd");
    DATA.target = ""; save(); closeSheet(); toast("Target verwijderd");
  };
}

function openFullLog(){
  openSheet(`<h3>Volledige wijzigingenlog</h3>
    <p style="font-size:12px;color:var(--ink2);margin-top:-8px">Readonly · nieuwste eerst</p>
    <div class="loglist" id="loglist"><div class="empty">Laden…</div></div>
    <button class="cta" id="flOk">Sluiten</button>`);
  $("#flOk").onclick = closeSheet;
  fetchLog().then(log=>{
    const lines = log.map(l=>
      `<div class="logline"><b>${esc(l.who)}</b> · ${esc(l.target)}${l.date? " · "+fmtDate(l.date) : ""}<br>“${esc(l.from||"—")}” → “${esc(l.to||"—")}”<div class="t">${esc(l.t)}</div></div>`
    ).join("");
    const el = $("#loglist"); if(el) el.innerHTML = lines || `<div class="empty">Nog geen wijzigingen</div>`;
  });
}

$("#fabAdd").onclick = openDateSheet;

/* ---------- start ---------- */
load();
</script>
</body>
</html>
